name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.5.3"

jobs:
  build:
    name: 构建应用
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码检查
        run: pnpm run lint

      - name: 代码格式检查
        run: pnpm run format:check

      - name: 类型检查
        run: pnpm run type-check

      - name: 单元测试
        run: pnpm run test

      - name: GIF 编解码自校验
        run: pnpm run test:gif

      - name: 构建应用
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: 验证构建产物
        run: |
          echo "检查构建输出目录..."
          ls -la out/
          echo "检查关键静态页面..."
          test -f out/index.html || (echo "缺少 index.html" && exit 1)
          test -f out/.nojekyll || (echo "缺少 .nojekyll" && exit 1)
          test -d out/_next || (echo "缺少 _next 产物" && exit 1)
          test -f out/adjust/index.html || echo "缺少 adjust/index.html"
          test -f out/convert/index.html || echo "缺少 convert/index.html"
          test -f out/metadata/index.html || echo "缺少 metadata/index.html"
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
